version: '3.8' # Phiên bản cấu hình Docker Compose

services:
  web-server:           # Tên dịch vụ (bạn có thể đặt tùy ý)
    image: nginx:latest # Sử dụng image Nginx mới nhất từ Docker Hub
    ports:
      - "8080:80"       # Map cổng 8080 (máy host) vào cổng 80 (container)
    restart: always     # Tự động khởi động lại nếu container bị lỗi